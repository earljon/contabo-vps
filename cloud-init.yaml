#cloud-config
# ============================================================================
# Contabo VPS bootstrap — Ubuntu 24.04 LTS
# ----------------------------------------------------------------------------
# Rendered secrets:
#   ${AWS_ACCESS_KEY_ID} ${AWS_SECRET_ACCESS_KEY} ${AWS_REGION}
#   ${CLOUDFLARED_TUNNEL_TOKEN} ${SLACK_WEBHOOK_URL} ${SSH_PUBLIC_KEY}
#   ${COOLIFY_INITIAL_EMAIL} ${COOLIFY_INITIAL_PASSWORD}
# ============================================================================

hostname: <%= hostname %>
preserve_hostname: false

package_update: true
package_upgrade: true

# ── Users ───────────────────────────────────────────────────────────────────
users:
  - name: root
    ssh_authorized_keys:
      - ${SSH_PUBLIC_KEY}
  - name: contabo
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    lock_passwd: true
    ssh_authorized_keys:
      - ${SSH_PUBLIC_KEY}

# ── Docker apt repo ───────────────────────────────────────────────────────────
apt:
  sources:
    docker:
      keyid: 8D81803C0EBFCD88
      keyserver: https://download.docker.com/linux/ubuntu/gpg
      source: "deb [signed-by=$KEY_FILE] https://download.docker.com/linux/ubuntu $RELEASE stable"

packages:
  # core tooling
  - ca-certificates
  - curl
  - wget
  - git
  - jq
  - unzip
  - gnupg
  - lsb-release
  # docker
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
  # hardening / networking
  - ufw
  - fail2ban
  - unattended-upgrades
  - apt-listchanges
  - openssl
  - net-tools
  - dnsutils
  - htop
  - logrotate

write_files:

  # ── sshd hardening ──────────────────────────────────────────────────────────
  - path: /etc/ssh/sshd_config.d/99-hardening.conf
    permissions: "0644"
    content: |
      # NOTE: On Ubuntu 24.04, ssh.socket owns the listening port (socket
      # activation). The port is therefore set via a ssh.socket drop-in
      # (see /etc/systemd/system/ssh.socket.d/), NOT here. Setting "Port" here
      # would be ignored by the socket and can cause confusion.
      # Key-only authentication
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      UsePAM yes
      # root: key-only (prohibit-password)
      PermitRootLogin prohibit-password
      PubkeyAuthentication yes
      AuthenticationMethods publickey
      # tightening
      X11Forwarding no
      AllowAgentForwarding no
      AllowTcpForwarding yes
      MaxAuthTries 3
      MaxSessions 10
      LoginGraceTime 30
      ClientAliveInterval 300
      ClientAliveCountMax 2

  # ── ssh.socket port override (Ubuntu 24.04 socket activation) ─────────────────
  # On 24.04, ssh.socket listens on the port, not sshd_config. We must clear the
  # default ListenStream (22) and set 2219, then daemon-reload + restart socket.
  - path: /etc/systemd/system/ssh.socket.d/override.conf
    permissions: "0644"
    content: |
      [Socket]
      ListenStream=
      ListenStream=2219

  # ── sysctl network hardening ──────────────────────────────────────────────────
  - path: /etc/sysctl.d/99-hardening.conf
    permissions: "0644"
    content: |
      # IP spoofing protection / reverse path filtering
      net.ipv4.conf.all.rp_filter = 1
      net.ipv4.conf.default.rp_filter = 1
      # Ignore ICMP broadcast requests
      net.ipv4.icmp_echo_ignore_broadcasts = 1
      # Disable source packet routing
      net.ipv4.conf.all.accept_source_route = 0
      net.ipv6.conf.all.accept_source_route = 0
      # Ignore send redirects
      net.ipv4.conf.all.send_redirects = 0
      net.ipv4.conf.default.send_redirects = 0
      # Block SYN attacks
      net.ipv4.tcp_syncookies = 1
      net.ipv4.tcp_max_syn_backlog = 2048
      net.ipv4.tcp_synack_retries = 2
      net.ipv4.tcp_syn_retries = 5
      # Do not accept ICMP redirects
      net.ipv4.conf.all.accept_redirects = 0
      net.ipv4.conf.default.accept_redirects = 0
      net.ipv6.conf.all.accept_redirects = 0
      net.ipv6.conf.default.accept_redirects = 0
      # Do not send ICMP redirects
      net.ipv4.conf.all.secure_redirects = 0
      net.ipv4.conf.default.secure_redirects = 0
      # Log martians
      net.ipv4.conf.all.log_martians = 1
      # Enable IP forwarding (required for docker/cloudflared)
      net.ipv4.ip_forward = 1

  # ── unattended-upgrades config ──────────────────────────────────────────────
  - path: /etc/apt/apt.conf.d/50unattended-upgrades
    permissions: "0644"
    content: |
      Unattended-Upgrade::Allowed-Origins {
          "${distro_id}:${distro_codename}";
          "${distro_id}:${distro_codename}-security";
          "${distro_id}ESMApps:${distro_codename}-apps-security";
          "${distro_id}ESM:${distro_codename}-infra-security";
      };
      Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "04:00";

  - path: /etc/apt/apt.conf.d/20auto-upgrades
    permissions: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::Download-Upgradeable-Packages "1";
      APT::Periodic::AutocleanInterval "7";

  # ── logrotate catch-all for /var/log ─────────────────────────────────────────
  # NOTE: package-specific rotation in /etc/logrotate.d/* still takes priority.
  # This catch-all covers stray *.log files not owned by another rule.
  - path: /etc/logrotate.d/zz-varlog-catchall
    permissions: "0644"
    content: |
      # ─────────────────────────────────────────────────────────────────
      # HOW TO ADD A NEW LOG FILE TO ROTATION
      #
      #  Option A (recommended): create a dedicated rule
      #    sudo tee /etc/logrotate.d/myapp >/dev/null <<'EOF'
      #    /var/log/myapp/*.log {
      #        daily
      #        rotate 14
      #        compress
      #        delaycompress
      #        missingok
      #        notifempty
      #        copytruncate
      #    }
      #    EOF
      #    sudo logrotate --debug /etc/logrotate.d/myapp   # dry-run test
      #
      #  Option B: drop the file under a path already matched below.
      #
      #  Test all rules:  sudo logrotate -d /etc/logrotate.conf
      #  Force a run:     sudo logrotate -f /etc/logrotate.conf
      # ─────────────────────────────────────────────────────────────────
      /var/log/*.log {
          daily
          rotate 14
          compress
          delaycompress
          missingok
          notifempty
          sharedscripts
          copytruncate
      }

  # ── Slack notification helper ─────────────────────────────────────────────────
  - path: /usr/local/bin/slack-notify
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      # Usage: slack-notify "<level>" "<message>"
      #   level: INFO | SUCCESS | ERROR
      set -u
      WEBHOOK="${SLACK_WEBHOOK_URL}"
      LEVEL="${1:-INFO}"
      MESSAGE="${2:-}"
      HOST="$(hostname -f 2>/dev/null || hostname)"
      case "$LEVEL" in
        SUCCESS) EMOJI=":white_check_mark:" ;;
        ERROR)   EMOJI=":rotating_light:"   ;;
        *)       EMOJI=":information_source:" ;;
      esac
      [ -z "$WEBHOOK" ] && exit 0
      PAYLOAD=$(jq -n \
        --arg text "${EMOJI} *[${LEVEL}]* \`${HOST}\` — ${MESSAGE}" \
        '{text: $text}')
      curl -fsS -X POST -H 'Content-Type: application/json' \
        --data "${PAYLOAD}" "${WEBHOOK}" >/dev/null 2>&1 || true

  # ── MOTD with server info ─────────────────────────────────────────────────────
  - path: /etc/update-motd.d/99-server-info
    permissions: "0755"
    content: |
      #!/bin/sh
      echo ""
      echo "  Host:         $(hostname -f)"
      echo "  SSH:          ssh -p 2219 contabo@$(hostname -f)"
      echo "  Coolify:      https://coolify.acacialabs.com"
      echo "  Cloudflared:  systemctl status cloudflared"
      echo "  CrowdSec:     sudo cscli metrics"
      echo "  Setup status: cloud-init status --long"
      echo "  Setup log:    tail -f /var/log/cloud-init-output.log"
      echo ""

  # ── Consolidated bootstrap script ─────────────────────────────────────────────
  # IMPORTANT: cloud-init concatenates ALL runcmd entries into ONE /bin/sh script,
  # so a `#!/bin/bash` line inside a runcmd block is just a mid-file comment and is
  # ignored — and `trap ... ERR` (a bash feature) fails under dash with
  # "trap: ERR: bad trap". To get a guaranteed bash interpreter we put everything
  # in this standalone script (its shebang IS line 1 of its own file) and invoke it
  # from a single runcmd line.
  - path: /usr/local/sbin/bootstrap.sh
    permissions: "0750"
    content: |
      #!/bin/bash
      set -uo pipefail

      # Per-stage error reporting that works under bash without a global ERR trap.
      run_stage() {
        STAGE_NAME="$1"; shift
        if "$@"; then
          return 0
        else
          RC=$?
          /usr/local/bin/slack-notify ERROR "${STAGE_NAME} failed (exit ${RC})"
          exit "${RC}"
        fi
      }

      # ── Stage: contabo user (defensive; idempotent) ───────────────────────────
      stage_user() {
        local SSH_KEY='${SSH_PUBLIC_KEY}'
        if ! id -u contabo >/dev/null 2>&1; then
          useradd --create-home --shell /bin/bash contabo
        fi
        echo 'contabo ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/90-contabo
        chmod 0440 /etc/sudoers.d/90-contabo
        visudo -cf /etc/sudoers.d/90-contabo
        getent group docker >/dev/null 2>&1 || groupadd docker
        usermod -aG sudo,docker contabo
        passwd -l contabo || true
        install -d -m 700 -o contabo -g contabo /home/contabo/.ssh
        if [ -n "${SSH_KEY}" ]; then
          printf '%s\n' "${SSH_KEY}" > /home/contabo/.ssh/authorized_keys
        else
          touch /home/contabo/.ssh/authorized_keys
        fi
        chmod 600 /home/contabo/.ssh/authorized_keys
        chown -R contabo:contabo /home/contabo/.ssh
        /usr/local/bin/slack-notify INFO "contabo user ready with SSH key + passwordless sudo"
      }

      # ── Stage: AWS CLI v2 + credentials for root and contabo ──────────────────
      stage_aws() {
        cd /tmp
        curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-$(uname -m).zip" -o awscliv2.zip
        unzip -q awscliv2.zip
        ./aws/install --update
        rm -rf /tmp/aws /tmp/awscliv2.zip
        write_aws_creds() {
          local USER_HOME="$1" OWNER="$2"
          install -d -m 700 -o "${OWNER}" -g "${OWNER}" "${USER_HOME}/.aws"
          cat > "${USER_HOME}/.aws/credentials" <<EOF
      [default]
      aws_access_key_id = ${AWS_ACCESS_KEY_ID}
      aws_secret_access_key = ${AWS_SECRET_ACCESS_KEY}
      EOF
          cat > "${USER_HOME}/.aws/config" <<EOF
      [default]
      region = ${AWS_REGION}
      output = json
      EOF
          chmod 600 "${USER_HOME}/.aws/credentials" "${USER_HOME}/.aws/config"
          chown -R "${OWNER}:${OWNER}" "${USER_HOME}/.aws"
        }
        write_aws_creds /root root
        write_aws_creds /home/contabo contabo
        /usr/local/bin/slack-notify INFO "AWS CLI v2 installed + credentials written"
      }

      # ── Stage: UFW (allow 2219 only) ──────────────────────────────────────────
      stage_ufw() {
        ufw default deny incoming
        ufw default allow outgoing
        ufw allow 2219/tcp comment 'SSH custom port'
        ufw --force enable
        /usr/local/bin/slack-notify INFO "UFW enabled (inbound: 2219/tcp only)"
      }

      # ── Stage: sysctl + sshd hardening ────────────────────────────────────────
      stage_hardening() {
        sysctl --system >/dev/null 2>&1 || true

        # Contabo's injected bootcmd forces "PermitRootLogin yes" into the MAIN
        # /etc/ssh/sshd_config on every boot. Our drop-in (prohibit-password)
        # overrides it at runtime, but we also rewrite the main-file line so the
        # two configs agree and root can never silently become password-reachable.
        if [ -f /etc/ssh/sshd_config ]; then
          sed -i 's/^[#[:space:]]*PermitRootLogin .*/PermitRootLogin prohibit-password/' /etc/ssh/sshd_config
          grep -q '^PermitRootLogin prohibit-password' /etc/ssh/sshd_config \
            || echo 'PermitRootLogin prohibit-password' >> /etc/ssh/sshd_config
        fi

        # Validate sshd config; capture the actual error text if it fails.
        if SSHD_TEST_OUT="$(sshd -t 2>&1)"; then
          # Socket activation (Ubuntu 24.04): the port lives in ssh.socket.
          systemctl daemon-reload
          # Restart the socket so it binds 2219; restarting ssh.service alone
          # would NOT change the listening port under socket activation.
          systemctl restart ssh.socket 2>/dev/null || true
          # Also restart the service to pick up auth/hardening directives.
          systemctl restart ssh 2>/dev/null || systemctl restart sshd 2>/dev/null || true
          /usr/local/bin/slack-notify INFO "SSH hardened; ssh.socket on 2219, root=prohibit-password, sysctl applied"
        else
          # Pass the real reason to Slack so failures are diagnosable.
          /usr/local/bin/slack-notify ERROR "sshd config test FAILED — not restarting ssh. Reason: ${SSHD_TEST_OUT}"
        fi
      }

      # ── Stage: CrowdSec agent + iptables bouncer ──────────────────────────────
      stage_crowdsec() {
        curl -fsSL https://install.crowdsec.net | sh
        apt-get install -y crowdsec
        systemctl enable --now crowdsec
        apt-get install -y crowdsec-firewall-bouncer-iptables
        systemctl enable --now crowdsec-firewall-bouncer
        /usr/local/bin/slack-notify INFO "CrowdSec agent + iptables bouncer active"
      }

      # ── Stage: docker + unattended-upgrades ───────────────────────────────────
      stage_services() {
        systemctl enable --now docker
        systemctl enable --now unattended-upgrades
        /usr/local/bin/slack-notify INFO "Docker + unattended-upgrades enabled"
      }

      # ── Stage: Coolify install + initial admin ────────────────────────────────
      stage_coolify() {
        curl -fsSL https://cdn.coollabs.io/coolify/install.sh | bash

        # Wait for Coolify HTTP to become healthy (up to 120 s)
        local i=0
        until curl -sf http://localhost:8000/api/health >/dev/null 2>&1; do
          i=$((i + 1))
          if [ "$i" -ge 24 ]; then
            /usr/local/bin/slack-notify ERROR "Coolify did not become healthy after 120 s"
            return 1
          fi
          sleep 5
        done

        # Register initial admin (only succeeds while no admin exists)
        curl -sf -X POST http://localhost:8000/api/v1/register \
          -H 'Content-Type: application/json' \
          -d "{\"name\":\"Admin\",\"email\":\"${COOLIFY_INITIAL_EMAIL}\",\"password\":\"${COOLIFY_INITIAL_PASSWORD}\",\"password_confirmation\":\"${COOLIFY_INITIAL_PASSWORD}\"}" \
          >/dev/null 2>&1 || true

        /usr/local/bin/slack-notify INFO "Coolify installed + admin registered — add coolify.acacialabs.com in CF Zero Trust after bootstrap"
      }

      # ── Stage: cloudflared tunnel (token) ─────────────────────────────────────
      stage_cloudflared() {
        mkdir -p --mode=0755 /usr/share/keyrings
        curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg \
          -o /usr/share/keyrings/cloudflare-main.gpg
        echo "deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared $(lsb_release -cs) main" \
          > /etc/apt/sources.list.d/cloudflared.list
        apt-get update
        apt-get install -y cloudflared
        cloudflared service install ${CLOUDFLARED_TUNNEL_TOKEN}
        systemctl enable --now cloudflared || true
        /usr/local/bin/slack-notify INFO "cloudflared tunnel connector installed + running"
      }

      # ── Stage: pre-reboot lockout guard ───────────────────────────────────────
      stage_lockout_guard() {
        local ROOT_KEYS=/root/.ssh/authorized_keys
        local CONTABO_KEYS=/home/contabo/.ssh/authorized_keys
        if [ ! -s "$ROOT_KEYS" ] && [ ! -s "$CONTABO_KEYS" ]; then
          /usr/local/bin/slack-notify ERROR "NO SSH KEYS on either user — reverting to safe sshd (port 22) to prevent lockout. Fix SSH_PUBLIC_KEY secret."
          rm -f /etc/ssh/sshd_config.d/99-hardening.conf
          if sshd -t; then
            systemctl restart ssh || systemctl restart sshd || true
          fi
        fi
        return 0
      }

      # ── Orchestration ─────────────────────────────────────────────────────────
      /usr/local/bin/slack-notify INFO "cloud-init bootstrap started"
      run_stage "Stage: contabo user"    stage_user
      run_stage "Stage: AWS CLI"         stage_aws
      run_stage "Stage: UFW"             stage_ufw
      run_stage "Stage: ssh/sysctl"      stage_hardening
      run_stage "Stage: CrowdSec"        stage_crowdsec
      run_stage "Stage: docker/upgrades" stage_services
      run_stage "Stage: Coolify"         stage_coolify
      run_stage "Stage: cloudflared"     stage_cloudflared
      run_stage "Stage: lockout guard"   stage_lockout_guard
      /usr/local/bin/slack-notify SUCCESS "cloud-init bootstrap COMPLETE — ssh -p 2219 contabo@$(hostname -f)"

runcmd:
  # Single entry: run the consolidated bash script. This avoids cloud-init's
  # concatenation-into-one-/bin/sh-script behavior that broke the ERR traps.
  - [ bash, /usr/local/sbin/bootstrap.sh ]

# ── final reboot to apply kernel/network + any unattended kernel upgrade ──────
power_state:
  mode: reboot
  delay: 1
  message: "Rebooting after cloud-init bootstrap"
  condition: true